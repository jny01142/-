[build]
  publish = "pwa"
  command = "npm install"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Checks every device's lectures every 15 minutes and sends a push to any
# device whose 24-hour reminder window has just opened.
[functions."send-reminders"]
  schedule = "*/15 * * * *"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
